project_id = "campusquest"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
# The OAuth callback route must be listed explicitly; Supabase rejects any
# redirectTo it has not been told about.
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
]
jwt_expiry = 3600

# Local Google sign-in. Fill the two secrets in .env (not .env.local — the
# Supabase CLI reads process env, not Next's) and restart `supabase start`.
# Leave disabled to keep using mock mode.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

[realtime]
enabled = true
